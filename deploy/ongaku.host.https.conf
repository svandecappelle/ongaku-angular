# nginx site for Ongaku, installed by "make install" as its own file (ongaku.host.conf):
# it never touches other sites. The domain, port and paths in capitals between underscores are filled in by the installer.
# Names below (map variable, upstream, SSL cache) are prefixed so they can't clash with other configurations.
# HTTPS: used once the Let's Encrypt folder has a certificate for the domain (make https).
# "Connection: upgrade" only for WebSocket requests (socket.io notifications).
map $http_upgrade $ongaku_connection {
    default upgrade;
    ''      close;
}

upstream ongaku_backend {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP challenge (certbot certonly --webroot), answered from this site's own folder.
    location /.well-known/acme-challenge/ {
        root __WEBROOT__;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    # Spelled out rather than included from /etc/letsencrypt: options-ssl-nginx.conf only exists when certbot's
    # nginx plugin wrote it, and including a missing file stops nginx from starting.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OngakuSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads of albums (zip) and torrents.
    client_max_body_size 2g;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Notifications: socket.io, WebSocket with a long-polling fallback.
    location /socket.io/ {
        proxy_pass http://ongaku_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ongaku_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Audio streams: no buffering, so that playback starts at once and seeking (Range requests) reaches the server.
    location /api/audio/stream/ {
        proxy_pass http://ongaku_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Uploads: stream the body to the server instead of buffering it on disk.
    location ~ ^/api/(audio/upload|uploader) {
        proxy_pass http://ongaku_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }

    # The app and its API (the Node server falls back to index.html for client-side routes).
    location / {
        proxy_pass http://ongaku_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
