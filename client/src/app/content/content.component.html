@let loggedIn = isLoggedIn$ | async;

@if (loggedIn && themeService.showBackground()) {
  <div class="background" [style.backgroundImage]="'url(' + themeService.backgroundUrl() + ')'"></div>
  <div class="background-overlay"></div>
}

@if (loggedIn) {
  <app-shell></app-shell>
}
<app-notifications></app-notifications>

<div class="routing-content" [class.modern-layout]="loggedIn">
  <router-outlet></router-outlet>
</div>
