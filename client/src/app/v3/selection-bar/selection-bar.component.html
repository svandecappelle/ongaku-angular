@if (actions.selected(); as selected) {
  @if (selected.length) {
    <div class="bar" role="toolbar" aria-label="Actions on the selected tracks">
      <span class="count" aria-live="polite">{{ selected.length }} selected</span>
      <button type="button" class="primary" (click)="actions.playFrom(selected)">
        <mat-icon>play_arrow</mat-icon>
        Play
      </button>
      <button type="button" class="labelled" (click)="actions.playNext(selected)">
        <mat-icon aria-hidden="true">queue_play_next</mat-icon>
        <span class="label">Play next</span>
      </button>
      <button type="button" class="labelled" (click)="actions.addToQueue(selected)">
        <mat-icon aria-hidden="true">playlist_add</mat-icon>
        <span class="label">Add to queue</span>
      </button>
      @let allInLibrary = actions.allInLibrary(selected);
      <button type="button" class="icon" (click)="actions.toggleLibrary(selected)"
        [attr.aria-label]="allInLibrary ? 'Remove from my library' : 'Add to my library'"
        [matTooltip]="allInLibrary ? 'Remove from my library' : 'Add to my library'">
        <mat-icon>{{ allInLibrary ? 'remove_circle_outline' : 'library_add' }}</mat-icon>
      </button>
      @let allLiked = actions.allLiked(selected);
      <button type="button" class="icon" (click)="actions.toggleLike(selected)"
        [attr.aria-label]="allLiked ? 'Unlike' : 'Like'" [matTooltip]="allLiked ? 'Unlike' : 'Like'">
        <mat-icon>{{ allLiked ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
      <button type="button" class="icon" [matMenuTriggerFor]="playlistMenu.menu()" aria-label="Add to playlist" matTooltip="Add to playlist">
        <mat-icon>queue_music</mat-icon>
      </button>
      <app-add-to-playlist-menu #playlistMenu [tracks]="selected" (done)="actions.clear()"></app-add-to-playlist-menu>
      @if (actions.remover(); as remover) {
        <button type="button" class="icon" (click)="actions.removeFromPage(selected)" [attr.aria-label]="remover.label" [matTooltip]="remover.label">
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
      }
      <button type="button" class="icon" (click)="actions.details(selected)" aria-label="Details and tags" matTooltip="Details and tags">
        <mat-icon>description</mat-icon>
      </button>
      @if (actions.canDeleteAll(selected)) {
        <button type="button" class="icon danger" (click)="actions.deleteTracks(selected)" aria-label="Delete the files" matTooltip="Delete the files">
          <mat-icon>delete_forever</mat-icon>
        </button>
      }
      <span class="divider" aria-hidden="true"></span>
      <button type="button" class="icon" (click)="actions.clear()" aria-label="Clear the selection (Escape)" matTooltip="Clear (Esc)">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
}
