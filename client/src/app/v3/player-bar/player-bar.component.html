<footer class="bar" aria-label="Player">
  @if (playback.current(); as track) {
    <div class="now-playing">
      <span class="cover">
        <mat-icon aria-hidden="true">album</mat-icon>
        <img [src]="cover(track.uid)" alt="" (error)="$any($event.target).hidden = true" (load)="$any($event.target).hidden = false">
      </span>
      <span class="meta">
        <span class="title">{{ track.title }}</span>
        <span class="sub">{{ track.artist }}@if (track.album) { · {{ track.album }}}</span>
      </span>
    </div>
  }

  <div class="transport">
    <div class="buttons">
      <button mat-icon-button type="button" (click)="playback.previous()" [disabled]="playback.position() <= 0" aria-label="Previous track">
        <mat-icon>skip_previous</mat-icon>
      </button>
      <button type="button" class="play" (click)="playback.toggle()" [attr.aria-label]="playback.playing() ? 'Pause' : 'Play'">
        @if (playback.state() === 'loading') {
          <mat-spinner diameter="22" strokeWidth="3" aria-hidden="true"></mat-spinner>
        } @else {
          <mat-icon>{{ playback.playing() ? 'pause' : 'play_arrow' }}</mat-icon>
        }
      </button>
      <button mat-icon-button type="button" (click)="playback.next()" [disabled]="!playback.upcoming().length" aria-label="Next track">
        <mat-icon>skip_next</mat-icon>
      </button>
    </div>
    <div class="seek">
      <span class="time">{{ formatTime(position()) }}</span>
      <mat-slider [min]="0" [max]="playback.duration() || 1" [step]="1" [disabled]="!playback.duration()">
        <input matSliderThumb [value]="position()" aria-label="Position in the track"
          [attr.aria-valuetext]="formatTime(position()) + ' of ' + formatTime(playback.duration())"
          (input)="dragSeek($event)" (change)="commitSeek($event)">
      </mat-slider>
      <span class="time">{{ formatTime(playback.duration()) }}</span>
    </div>
  </div>

  <div class="extras">
    <button mat-icon-button type="button" (click)="toggleQueue.emit()" [class.active]="queueOpen()"
      [attr.aria-pressed]="queueOpen()" aria-label="Queue" matTooltip="Queue">
      <mat-icon>queue_music</mat-icon>
    </button>
    <span class="volume">
      <button mat-icon-button type="button" (click)="toggleMute()" [attr.aria-label]="muted() ? 'Unmute' : 'Mute'">
        <mat-icon>{{ muted() ? 'volume_off' : volume() < 0.5 ? 'volume_down' : 'volume_up' }}</mat-icon>
      </button>
      <mat-slider [min]="0" [max]="1" [step]="0.05">
        <input matSliderThumb [value]="volume()" aria-label="Volume" (input)="setVolume($event)">
      </mat-slider>
    </span>
  </div>
</footer>
