<div>
  @if (isLoggedIn$ | async) {
    <mat-toolbar color="primary" class="mat-elevation-z6">
      <span>Ongaku</span>
      <span class="sub-title">Music app</span>
      <nav>
        <button mat-icon-button routerLink="/">
          <mat-icon aria-label="Home">home</mat-icon>
        </button>
        <button mat-icon-button routerLink="/admin">
          <mat-icon aria-label="Admin panel">settings</mat-icon>
        </button>
      </nav>
      <span class="spacer"></span>
      <mat-form-field class="search">
        <input matInput (change)="search($event.target.value)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-icon-button [matMenuTriggerFor]="themeMenu" aria-label="Theme">
        <mat-icon>palette</mat-icon>
      </button>
      <mat-menu #themeMenu="matMenu">
        @for (theme of themeService.themes(); track theme.id) {
          <button mat-menu-item class="theme-item" (click)="themeService.setTheme(theme.id)"
            [attr.aria-pressed]="theme.id === themeService.selected()">
            <span class="theme-swatch" [style.background]="theme.colors.bg">
              <span [style.background]="theme.colors.accent"></span>
            </span>
            <span class="theme-label">
              {{theme.label}}
              <small>{{theme.description}}</small>
            </span>
            @if (theme.id === themeService.selected()) {
              <mat-icon class="theme-check">check</mat-icon>
            }
          </button>
        }
        <mat-divider></mat-divider>
        <button mat-menu-item role="menuitemcheckbox" [attr.aria-checked]="themeService.followSystem()"
          (click)="$event.stopPropagation(); themeService.setFollowSystem(!themeService.followSystem())">
          <mat-icon>{{ themeService.followSystem() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
          <span>Follow system light/dark mode</span>
        </button>
        <a mat-menu-item routerLink="/profile/appearance">
          <mat-icon>tune</mat-icon>
          <span>Customize appearance…</span>
        </a>
      </mat-menu>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        @if (isLoggedIn$ | async) {
          <button mat-menu-item (click)="onLogout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Logout</span>
          </button>
        }
        <button mat-menu-item routerLink="/profile">
          <mat-icon>account_circle</mat-icon>
          <span>Edit profile</span>
        </button>
        <button mat-menu-item routerLink="/profile/appearance">
          <mat-icon>palette</mat-icon>
          <span>Appearance</span>
        </button>
      </mat-menu>
    </mat-toolbar>
  }
</div>
