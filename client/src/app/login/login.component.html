<div class="signin-content">
  <mat-card appearance="outlined">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <p>Please login to continue</p>
        <mat-form-field class="full-width-input">
          <mat-label>User</mat-label>
          <input matInput
            formControlName="userName" required>
          @if (isFieldInvalid('userName')) {
            <mat-error>
              Please inform your user name
            </mat-error>
          }
        </mat-form-field>
        <mat-form-field class="full-width-input">
          <mat-label>Password</mat-label>
          <input matInput type="password"
            formControlName="password" required>
          @if (isFieldInvalid('userName')) {
            <mat-error>
              Please inform your password
            </mat-error>
          }
        </mat-form-field>
        <div>
          <mat-checkbox matCheckbox formControlName="rememberme">Remember me</mat-checkbox>
        </div>
        <button mat-raised-button color="primary" type="submit">Login</button>
      </form>
      <a routerLink="/register">Not have an account ?</a>
      @if (loginInProgress) {
        <mat-progress-bar class="login-in-progress" [mode]="'indeterminate'"></mat-progress-bar>
      }
    </mat-card-content>
  </mat-card>
</div>
