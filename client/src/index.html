<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ongaku</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Re-apply the last theme settings (saved by ThemeService) before Angular boots,
    // to avoid a flash of the default theme. ThemeService takes over afterwards.
    try {
      var applied = JSON.parse(localStorage.getItem('ongaku.theme.applied') || 'null');
      if (applied) {
        var root = document.documentElement;
        Object.keys(applied.attributes || {}).forEach(function (name) {
          root.dataset[name] = applied.attributes[name];
        });
        Object.keys(applied.variables || {}).forEach(function (name) {
          root.style.setProperty(name, applied.variables[name]);
        });
        root.style.colorScheme = applied.dark ? 'dark' : 'light';
      }
    } catch (e) {}
  </script>
  <!--<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">-->
  <link href="/assets/fonts/iconfont/material-icons.css?family=Material+Icons" rel="stylesheet">

  <script src="node_modules/moment/min/moment-with-locales.min.js"></script>
</head>
<body>
  <app-root>

      <div class="loader">
        <div class="segment-holder">
          <div class="segment one"></div>
        </div>
        <div class="segment-holder">
          <div class="segment two"></div>
        </div>
        <div class="segment-holder">
          <div class="segment three"></div>
        </div>
        <div class="segment-holder">
          <div class="segment four"></div>
        </div>
      </div>

  </app-root>
</body>
</html>
