# Continuous integration: the test suite (API and browser), the Docker image and the Android
# application, on every push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push of the same branch replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (API and browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install ffmpeg (the test music, the waveforms, the posters)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          ffmpeg -hide_banner -encoders | grep -q libvpx

      # node-wave, an optional dependency, comes from a git+ssh repository and is not in the lock
      # file: the optional dependencies are left out, as in the Docker image
      - name: Install the server dependencies
        run: |
          npm pkg delete optionalDependencies
          npm install --ignore-scripts --no-audit --no-fund

      - name: Install the client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build the client
        working-directory: client
        run: npx ng build

      # CI is set: a missing tool fails the run instead of skipping tests (see test/run.mjs)
      - name: Run the tests
        env:
          CHROME: /usr/bin/google-chrome
          ONGAKU_TEST_ARTIFACTS: ${{ runner.temp }}/ongaku-test
        run: node test/run.mjs

      - name: Keep the server log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: ${{ runner.temp }}/ongaku-test
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ongaku:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the number of commits
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install the Android SDK parts
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      # Signed with a key made for this run only: it checks the build. Phones refuse it over an
      # application signed with the key of a server ("make apk").
      - name: Build the APK
        run: |
          ONGAKU_VERSION_NAME="$(node -p "require('./package.json').version")"
          ONGAKU_VERSION_CODE="$(git rev-list --count HEAD)"
          export ONGAKU_VERSION_NAME ONGAKU_VERSION_CODE
          sh android/build.sh

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: ongaku-apk-test-signature
          path: android/dist/
          retention-days: 14
